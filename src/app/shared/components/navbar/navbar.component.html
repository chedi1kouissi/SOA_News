<nav class="navbar">
    <div class="container">
        <a routerLink="/" class="logo">
            📰 SOA News
        </a>

        <div class="nav-links">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>

            <ng-container *ngIf="currentUser$ | async as user; else guestLinks">
                <a routerLink="/for-you" routerLinkActive="active">For You</a>
                <a routerLink="/saved" routerLinkActive="active">Saved Articles</a>
                <div class="user-menu">
                    <span class="username">{{ user.username }}</span>
                    <button (click)="logout()" class="btn-logout">Logout</button>
                </div>
            </ng-container>

            <ng-template #guestLinks>
                <a routerLink="/login" routerLinkActive="active">Login</a>
                <a routerLink="/register" routerLinkActive="active" class="btn-register">Register</a>
            </ng-template>
        </div>
    </div>
</nav>
