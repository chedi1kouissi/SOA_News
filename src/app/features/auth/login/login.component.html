<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Access your personalized news feed</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" formControlName="username" placeholder="Enter your username">
                <div class="error-msg" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
                    Username is required
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" formControlName="password" placeholder="Enter your password">
                <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                    Password is required
                </div>
            </div>

            <div class="error-alert" *ngIf="error">
                {{ error }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
                {{ isLoading ? 'Logging in...' : 'Login' }}
            </button>

            <p class="auth-footer">
                Don't have an account? <a routerLink="/register">Register here</a>
            </p>
        </form>
    </div>
</div>
